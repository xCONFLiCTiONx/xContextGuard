name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\src\xContextGuard\xContextGuard.csproj
      - name: Build
        run: dotnet build .\src\xContextGuard\xContextGuard.csproj --configuration Release --no-restore
